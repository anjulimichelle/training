<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Assessment</title>
<style>
  :root { --purple: #673ab7; --ink: #202124; --ink-2: #5f6368; --bg: #f0ebf8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Roboto, "Segoe UI", Arial, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  .banner { background: #fff4e5; color: #8a4b00; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
  .card { background: #fff; border-radius: 8px; padding: 20px 24px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .card.head { border-top: 10px solid var(--purple); }
  .sec-tab { background: var(--purple); color: #fff; display: inline-block; padding: 6px 14px; border-radius: 8px 8px 0 0; font-size: 13px; margin-top: 10px; }
  .card.sec { border-top: 10px solid var(--purple); border-top-left-radius: 0; }
  h1 { font-size: 28px; font-weight: 400; margin: 0 0 8px; }
  h2 { font-size: 22px; font-weight: 400; margin: 0 0 6px; }
  .meta { color: var(--ink-2); font-size: 13px; }
  label.q { display: block; font-size: 16px; margin-bottom: 10px; }
  .req { color: #d93025; }
  input, textarea { width: 100%; font: inherit; border: 0; border-bottom: 1px solid #dadce0; padding: 6px 0; background: transparent; }
  input:focus, textarea:focus { outline: none; border-bottom: 2px solid var(--purple); }
  input[readonly] { color: var(--ink-2); }
  textarea { min-height: 70px; resize: vertical; }
  .btns { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 40px; gap: 10px; }
  button { background: var(--purple); color: #fff; border: 0; border-radius: 4px; padding: 10px 24px; font: inherit; cursor: pointer; }
  button.secondary { background: #fff; color: var(--purple); box-shadow: inset 0 0 0 1px #dadce0; }
  .err { color: #d93025; font-size: 13px; margin-top: 6px; }
  .progress { color: var(--ink-2); font-size: 13px; }
  a { color: #1a73e8; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="card">Loading…</div></div>
<script>
(function () {
  'use strict';
  const quizId = location.pathname.split('/').pop();
  const root = document.getElementById('root');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https?:\/\//i.test(String(u || '')) || String(u || '').startsWith('/uploads/') ? esc(u) : '#');
  let quiz = null;
  let page = 0; // 0 = identity, 1..n = tickets
  const answers = { traineeName: '', traineeEmail: '', tickets: {} };

  fetch(`/api/public/quiz/${encodeURIComponent(quizId)}`).then((r) => r.json().then((j) => ({ ok: r.ok, j }))).then(({ ok, j }) => {
    if (!ok) { root.innerHTML = `<div class="card">${esc(j.error || 'This form is not available.')}</div>`; return; }
    quiz = j.quiz;
    if (j.closed) { root.innerHTML = `<div class="card head"><h1>${esc(quiz.title)}</h1>This quiz is closed and no longer accepts responses.</div>`; return; }
    quiz.tickets.forEach((t) => (answers.tickets[t.id] = { q1: '', q2: '', q3: '', q4: '' }));
    render();
  });

  function header() {
    return `<div class="banner">Staging test form. Use fictional answers only. Nothing here is shared outside the staging app.</div>
      <div class="card head"><h1>${esc(quiz.title)}</h1>
      <div class="meta">Cohort: ${esc(quiz.cohort)}${quiz.trainingDay ? ' · ' + esc(quiz.trainingDay) : ''}${quiz.assessmentType ? ' · ' + esc(quiz.assessmentType) : ''}${quiz.deadline ? ' · Due ' + esc(quiz.deadline) : ''}<br>Quiz ID: ${esc(quiz.id)}</div>
      <div class="meta" style="margin-top:8px"><span class="req">*</span> Indicates required question</div></div>`;
  }

  function render(error) {
    const total = quiz.tickets.length;
    let body = '';
    if (page === 0) {
      body = `<div class="card"><label class="q" for="name">Full name <span class="req">*</span></label><input id="name" value="${esc(answers.traineeName)}" autocomplete="name"></div>
        <div class="card"><label class="q" for="email">Email <span class="req">*</span></label><input id="email" type="email" value="${esc(answers.traineeEmail)}" autocomplete="email"></div>
        <div class="card"><label class="q" for="cohort">Cohort</label><input id="cohort" value="${esc(quiz.cohort)}" readonly></div>`;
    } else {
      const t = quiz.tickets[page - 1];
      const a = answers.tickets[t.id];
      body = `<div class="sec-tab">Section ${page + 1} of ${total + 1}</div>
        <div class="card sec"><h2>Ticket ${t.number}</h2>
          <div>Ticket reference: <a href="${safeUrl(t.url)}" target="_blank" rel="noopener">${esc(t.url)}</a></div>
          ${t.description ? `<div class="meta" style="margin-top:6px">${esc(t.description)}</div>` : ''}
          ${t.context ? `<div class="meta" style="margin-top:6px">${esc(t.context)}</div>` : ''}
          ${t.attachments.map((x) => `<div class="meta">Attachment: <a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.name || x.url)}</a></div>`).join('')}
        </div>
        ${quiz.questions.map((q) => `<div class="card"><label class="q" for="${q.key}">${esc(q.label)} <span class="req">*</span></label><textarea id="${q.key}" placeholder="Your answer">${esc(a[q.key])}</textarea></div>`).join('')}`;
    }
    root.innerHTML = header() + body + (error ? `<div class="card err">${esc(error)}</div>` : '') +
      `<div class="btns"><div>${page > 0 ? '<button class="secondary" id="back">Back</button>' : ''}</div>
       <span class="progress">Page ${page + 1} of ${total + 1}</span>
       <button id="next">${page === total ? 'Submit' : 'Next'}</button></div>`;
    const back = document.getElementById('back');
    if (back) back.onclick = () => { save(); page--; render(); window.scrollTo(0, 0); };
    document.getElementById('next').onclick = next;
  }

  function save() {
    if (page === 0) {
      answers.traineeName = document.getElementById('name').value.trim();
      answers.traineeEmail = document.getElementById('email').value.trim();
    } else {
      const t = quiz.tickets[page - 1];
      quiz.questions.forEach((q) => (answers.tickets[t.id][q.key] = document.getElementById(q.key).value));
    }
  }

  async function next() {
    save();
    if (page === 0) {
      if (!answers.traineeName || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(answers.traineeEmail)) return render('Enter your full name and a valid email.');
    } else {
      const a = answers.tickets[quiz.tickets[page - 1].id];
      if (quiz.questions.some((q) => !String(a[q.key]).trim())) return render('Answer every question. Type N/A where it does not apply.');
    }
    if (page < quiz.tickets.length) { page++; render(); window.scrollTo(0, 0); return; }
    const btn = document.getElementById('next');
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    const res = await fetch(`/api/public/quiz/${encodeURIComponent(quiz.id)}/submit`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ traineeName: answers.traineeName, traineeEmail: answers.traineeEmail, cohort: quiz.cohort, answers: quiz.tickets.map((t) => ({ ticketId: t.id, ...answers.tickets[t.id] })) }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) return render(j.error || 'Submission failed. Your answers are still on this page; try again.');
    root.innerHTML = header().replace('</div></div>', '</div></div>') + `<div class="card"><h2>Your response has been recorded.</h2><div class="meta">Submitted ${esc(new Date(j.submittedAt).toLocaleString())}</div></div>`;
  }
})();
</script>
</body>
</html>
